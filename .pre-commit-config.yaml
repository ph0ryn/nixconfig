repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
      - id: end-of-file-fixer
        files:
          glob:
            - "**/*"
            - "!**/flake.lock"
  - repo: local
    hooks:
      - id: nix-fmt
        name: nix-fmt
        entry: treefmt
        language: system
        files: .nix$
